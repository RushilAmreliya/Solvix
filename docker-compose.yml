services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nowcast-backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nowcast-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nowcast-simulator
    command: ["python", "-m", "backend.simulator", "--fps", "60", "--loop", "--backend", "http://backend:8000"]
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - simulation
